<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch List</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="Watch List" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --surface2: #242424;
      --border: #2e2e2e;
      --accent: #e50914;
      --accent-hover: #f40d1b;
      --text: #e8e8e8;
      --muted: #888;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 32px;
      height: 56px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }

    nav { display: flex; gap: 4px; }

    nav button {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      padding: 6px 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all 0.15s;
    }

    nav button:hover { color: var(--text); background: var(--surface2); }
    nav button.active { color: var(--text); background: var(--surface2); font-weight: 600; }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-bar {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }

    .search-bar input {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 14px;
      padding: 6px 12px;
      width: 400px;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-bar input:focus { border-color: var(--accent); }
    .search-bar input::placeholder { color: var(--muted); }

    button.btn {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      transition: background 0.15s;
    }

    button.btn:hover { background: var(--accent-hover); }
    button.btn.secondary { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    button.btn.secondary:hover { background: var(--border); }
    button.btn:disabled { opacity: 0.4; cursor: not-allowed; }

    main { padding: 24px; max-width: 1200px; margin: 0 auto; }

    .section { display: none; }
    .section.active { display: block; }

    /* Movie grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.15s, transform 0.15s;
      position: relative;
    }

    .card:hover { border-color: #444; transform: translateY(-2px); }

    .card img {
      width: 100%;
      aspect-ratio: 2/3;
      object-fit: cover;
      display: block;
      background: var(--surface2);
    }

    .card-body { padding: 10px; }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-year { font-size: 12px; color: var(--muted); margin-bottom: 8px; }

    .card-actions { display: flex; gap: 6px; }

    .card-actions button {
      flex: 1;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 5px 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-add { background: var(--accent); color: #fff; }
    .btn-add:hover { background: var(--accent-hover); }
    .btn-add.added { background: #1a4a1a; color: #4caf50; cursor: default; }

    .btn-remove { background: #2e1a1a; color: #f44336; }
    .btn-remove:hover { background: #3e2020; }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 64px 24px;
      color: var(--muted);
    }

    .empty p { font-size: 15px; margin-top: 8px; }

    /* Loading */
    .loading {
      text-align: center;
      padding: 48px;
      color: var(--muted);
      font-size: 14px;
    }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      font-size: 13px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.2s;
      pointer-events: none;
      z-index: 100;
    }

    #toast.show { opacity: 1; transform: translateY(0); }

    .section-header {
      margin-bottom: 16px;
    }

    .section-header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .section-header h2 { font-size: 18px; font-weight: 700; }

    .section-controls {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .count-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: var(--muted);
      padding: 2px 10px;
      margin-left: 10px;
    }

    .no-poster {
      width: 100%;
      aspect-ratio: 2/3;
      background: var(--surface2);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 12px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 24px;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      gap: 16px;
      padding: 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-poster {
      width: 64px;
      flex-shrink: 0;
      border-radius: 4px;
      overflow: hidden;
    }

    .modal-poster img { width: 100%; display: block; }

    .modal-meta { flex: 1; min-width: 0; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .modal-year { font-size: 13px; color: var(--muted); }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      align-self: flex-start;
      line-height: 1;
    }

    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 16px; }
    .modal-section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .providers {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .provider {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 64px;
    }

    .provider img {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      object-fit: cover;
    }

    .provider span {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.2;
    }

    .card { cursor: pointer; }

    /* Filter pills */
    .filter-pills { display: flex; gap: 6px; }

    .pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      padding: 4px 14px;
      transition: all 0.15s;
    }

    .pill:hover { color: var(--text); border-color: #555; }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Pin modal */
    .pin-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      border: 2px solid var(--muted);
      transition: background 0.15s, border-color 0.15s;
    }
    .pin-dot.filled { background: var(--accent); border-color: var(--accent); }

    .pin-key {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      cursor: pointer;
      font-size: 18px;
      font-weight: 600;
      padding: 14px;
      transition: background 0.1s;
    }
    .pin-key:hover { background: var(--border); }

    /* View toggle */
    .view-toggle { display: flex; gap: 4px; }

    .view-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 5px 9px;
      transition: all 0.15s;
    }

    .view-btn:hover { color: var(--text); }
    .view-btn.active { background: var(--surface); border-color: #555; color: var(--text); }

    /* List view */
    .list { display: flex; flex-direction: column; gap: 6px; }

    .list-row {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .list-row:hover { border-color: #444; }

    .list-title {
      flex: 1;
      font-size: 13px;
      font-weight: 600;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .list-year { font-size: 12px; color: var(--muted); flex-shrink: 0; }

    .list-btn {
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
  </style>
</head>
<body>

<header>
  <h1 style="cursor:pointer" onclick="switchTab('watchlist')">&#9654; WL</h1>
  <nav>
    <button class="active" data-tab="watchlist">My List</button>
    <button data-tab="search">Search</button>
  </nav>
  <div class="header-right">
    <button class="btn secondary" onclick="randomMovie(this)" style="font-size:16px;padding:5px 10px" title="Random movie">🎲</button>
  </div>
  <div class="header-right"></div>
</header>

<main>
  <!-- Watchlist -->
  <section class="section active" id="tab-watchlist">
    <div class="section-header">
      <div class="section-header-top">
        <div style="display:flex;align-items:center">
          <h2>My Watchlist</h2>
          <span class="count-badge" id="watchlistCount">0</span>
        </div>
        <button class="btn secondary" id="refreshBtn">&#8635; Refresh</button>
      </div>
      <div class="section-controls">
        <div class="filter-pills">
          <button class="pill active" data-filter="all" onclick="setFilter('all')">All</button>
          <button class="pill" data-filter="streamable" onclick="setFilter('streamable')">Stream</button>
          <button class="pill" data-filter="free" onclick="setFilter('free')">Free</button>
        </div>
        <select id="genreSelect" onchange="setGenreFilter()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:4px 8px;cursor:pointer;outline:none;">
          <option value="">All Genres</option>
        </select>
        <select id="sortSelect" onchange="applySort()" style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:4px 8px;cursor:pointer;outline:none;">
          <option value="title-asc" selected>Title: A–Z</option>
          <option value="added-desc">Added: Newest</option>
          <option value="added-asc">Added: Oldest</option>
          <option value="title-desc">Title: Z–A</option>
          <option value="year-desc">Year: Newest</option>
          <option value="year-asc">Year: Oldest</option>
        </select>
        <div class="view-toggle">
          <button class="view-btn active" id="wl-grid-btn" onclick="setView('watchlist','grid')" title="Grid">⊞</button>
          <button class="view-btn" id="wl-list-btn" onclick="setView('watchlist','list')" title="List">≡</button>
        </div>
      </div>
    </div>
    <div id="watchlistGrid"></div>
  </section>

  <!-- Adult -->
  <section class="section" id="tab-adult">
    <div class="section-header">
      <div class="section-header-top">
        <div style="display:flex;align-items:center">
          <h2>Adult</h2>
        </div>
        <div class="view-toggle">
          <button class="view-btn active" id="ad-grid-btn" onclick="setView('adult','grid')" title="Grid">⊞</button>
          <button class="view-btn" id="ad-list-btn" onclick="setView('adult','list')" title="List">≡</button>
        </div>
      </div>
    </div>
    <div id="adultGrid"></div>
  </section>

  <!-- Search -->
  <section class="section" id="tab-search">
    <div class="search-bar" id="searchBar">
      <input type="text" id="searchInput" placeholder="Search movies..." />
      <button class="btn" id="searchBtn">Search</button>
    </div>
    <div id="searchControls" style="display:none;margin-bottom:16px;text-align:center">
      <button class="btn secondary" onclick="clearSearch()">Clear Results</button>
    </div>
    <div id="genreQuickSearch" style="margin-bottom:20px">
      <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px">Browse by Genre</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button class="pill" onclick="browseGenre(28,'Action')">Action</button>
        <button class="pill" onclick="browseGenre(12,'Adventure')">Adventure</button>
        <button class="pill" onclick="browseGenre(16,'Animation')">Animation</button>
        <button class="pill" onclick="browseGenre(35,'Comedy')">Comedy</button>
        <button class="pill" onclick="browseGenre(80,'Crime')">Crime</button>
        <button class="pill" onclick="browseGenre(99,'Documentary')">Documentary</button>
        <button class="pill" onclick="browseGenre(18,'Drama')">Drama</button>
        <button class="pill" onclick="browseGenre(14,'Fantasy')">Fantasy</button>
        <button class="pill" onclick="browseGenre(27,'Horror')">Horror</button>
        <button class="pill" onclick="browseGenre(9648,'Mystery')">Mystery</button>
        <button class="pill" onclick="browseGenre(10749,'Romance')">Romance</button>
        <button class="pill" onclick="browseGenre(878,'Sci-Fi')">Sci-Fi</button>
        <button class="pill" onclick="browseGenre(53,'Thriller')">Thriller</button>
        <button class="pill" onclick="browseGenre(37,'Western')">Western</button>
      </div>
    </div>
    <div id="trendingSection">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
        <div style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px" id="trendingLabel">Trending This Week</div>
        <div class="view-toggle">
          <button class="view-btn active" id="sr-grid-btn" onclick="setView('search','grid')" title="Grid">⊞</button>
          <button class="view-btn" id="sr-list-btn" onclick="setView('search','list')" title="List">≡</button>
        </div>
      </div>
      <div id="trendingGrid"></div>
      <div id="loadMoreWrapper" style="display:none;text-align:center;padding:20px 0">
        <button class="btn secondary" id="loadMoreBtn" onclick="loadMoreTrending()">Load 20 More</button>
      </div>
    </div>
    <div id="searchGrid"></div>
  </section>

</main>

<div id="toast"></div>

<div style="text-align:center;padding:32px 0 16px">
  <button class="btn secondary" id="adultBtn" onclick="promptPin()" style="font-size:12px;opacity:0.4;padding:4px 12px">Adult</button>
</div>

<!-- Pin Modal -->
<div class="modal-overlay" id="pinOverlay" style="display:none" onclick="closePinModal(event)">
  <div class="modal" style="max-width:280px;text-align:center">
    <div class="modal-header" style="justify-content:space-between">
      <span style="font-size:14px;font-weight:600">Enter PIN</span>
      <button class="modal-close" onclick="closePinModal()">&#x2715;</button>
    </div>
    <div style="padding:24px 16px">
      <div id="pinDots" style="display:flex;justify-content:center;gap:12px;margin-bottom:20px">
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
        <div class="pin-dot"></div>
      </div>
      <div id="pinError" style="color:#f44336;font-size:12px;min-height:16px;margin-bottom:12px"></div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
        <button class="pin-key" onclick="pinKey('1')">1</button>
        <button class="pin-key" onclick="pinKey('2')">2</button>
        <button class="pin-key" onclick="pinKey('3')">3</button>
        <button class="pin-key" onclick="pinKey('4')">4</button>
        <button class="pin-key" onclick="pinKey('5')">5</button>
        <button class="pin-key" onclick="pinKey('6')">6</button>
        <button class="pin-key" onclick="pinKey('7')">7</button>
        <button class="pin-key" onclick="pinKey('8')">8</button>
        <button class="pin-key" onclick="pinKey('9')">9</button>
        <button class="pin-key" onclick="pinKey('del')" style="font-size:16px">⌫</button>
        <button class="pin-key" onclick="pinKey('0')">0</button>
        <button class="pin-key" onclick="pinKey('del')" style="opacity:0;pointer-events:none"></button>
      </div>
    </div>
  </div>
</div>

<!-- Movie Modal -->
<div class="modal-overlay" id="modalOverlay" style="display:none" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-poster" id="modalPoster"></div>
      <div class="modal-meta">
        <div class="modal-title" id="modalTitle"></div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap">
          <div class="modal-year" id="modalYear"></div>
          <div id="modalRating" style="font-size:13px;color:#f5c518;font-weight:600"></div>
          <div id="modalCert" style="font-size:11px;font-weight:700;border:1px solid var(--border);border-radius:3px;padding:1px 5px;color:var(--muted)"></div>
        </div>
        <div id="modalGenres" style="margin-top:6px;display:flex;flex-wrap:wrap;gap:4px"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="modal-body">
      <p id="modalOverview" style="font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:16px"></p>
      <div id="modalCast" style="margin-bottom:16px"></div>
      <div class="modal-section-label">Streaming on</div>
      <div class="providers" id="modalProviders"></div>
      <div style="margin-top:16px;display:flex;align-items:center;gap:10px">
        <button id="modalWatchlistBtn" style="font-size:13px;font-weight:600;padding:8px 14px;border-radius:var(--radius);border:none;cursor:pointer;transition:background 0.15s"></button>
        <a id="modalGoogleLink" href="#" target="_blank" rel="noopener"
           style="background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;font-weight:600;padding:8px 14px;text-decoration:none;display:inline-block">
          Search Google &rarr;
        </a>
      </div>
    </div>
  </div>
</div>

<script>
  const BASE = "https://api.themoviedb.org/3";
  const IMG  = "https://image.tmdb.org/t/p/w342";

  // Providers to hide entirely from the modal (exact name match, case-insensitive)
  const EXCLUDED_PROVIDERS = new Set([
    "amazon prime video",
  ]);

  // User's subscribed services — matched against TMDB provider_name (case-insensitive substring)
  const MY_SERVICES = [
    "netflix",
    "youtube tv",
    "youtube premium",
    "amazon prime",
    "peacock",
    "disney plus",
    "disney+",
    "hulu",
  ];

  function isMyService(providerName) {
    const name = providerName.toLowerCase();
    return MY_SERVICES.some(s => name.includes(s));
  }

  // State
  let state = {
    apiKey: localStorage.getItem("tmdb_api_key") || "%%TMDB_API_KEY%%",
    sessionId: localStorage.getItem("tmdb_session_id") || "%%TMDB_SESSION_ID%%",
    accountId: "",
    watchlistIds: new Set(),
    movies: [],
    movieData: {},       // id -> full movie object
    genres: {},          // id -> name
    providersCache: {},
    filter: "all",
    sort: "title-asc",
    genreFilter: "",
    view: { watchlist: "grid", search: "grid", adult: "grid" },
    adultUnlocked: false,
    trendingMovies: [],
    trendingPage: 0,
    trendingTotalPages: 1,
    trendingGenreId: null,
  };

  // ── API ──────────────────────────────────────────────────────────────────
  const apiCache = new Map(); // path -> { data, expires }

  const CACHE_TTL = {
    "/genre/movie/list": 24 * 60 * 60 * 1000,  // 24h — rarely changes
    "/trending":         30 * 60 * 1000,         // 30m
    "/discover":        30 * 60 * 1000,          // 30m
    "/search":          10 * 60 * 1000,          // 10m
    "/movie":           60 * 60 * 1000,          // 1h (providers, credits, etc.)
  };

  function cacheTTL(path) {
    for (const [prefix, ttl] of Object.entries(CACHE_TTL)) {
      if (path.startsWith(prefix)) return ttl;
    }
    return 0; // don't cache anything else
  }

  async function api(path, options = {}) {
    const isWrite = options.method && options.method !== "GET";
    const ttl = isWrite ? 0 : cacheTTL(path);

    if (ttl > 0 && apiCache.has(path)) {
      const entry = apiCache.get(path);
      if (Date.now() < entry.expires) return entry.data;
      apiCache.delete(path);
    }

    const sep = path.includes("?") ? "&" : "?";
    const url = `${BASE}${path}${sep}api_key=${state.apiKey}&session_id=${state.sessionId}`;
    const res = await fetch(url, options);
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.status_message || `HTTP ${res.status}`);
    }
    const data = await res.json();

    if (ttl > 0) apiCache.set(path, { data, expires: Date.now() + ttl });
    return data;
  }

  async function getAccountId() {
    if (state.accountId) return state.accountId;
    const data = await api("/account");
    state.accountId = String(data.id);
    return state.accountId;
  }

  async function fetchWatchlist() {
    const id = await getAccountId();
    const first = await api(`/account/${id}/watchlist/movies?page=1`);
    let movies = [...first.results];
    for (let p = 2; p <= first.total_pages; p++) {
      const d = await api(`/account/${id}/watchlist/movies?page=${p}`);
      movies.push(...d.results);
    }
    return movies;
  }

  async function setWatchlist(movieId, add) {
    const id = await getAccountId();
    await api(`/account/${id}/watchlist`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ media_type: "movie", media_id: movieId, watchlist: add }),
    });

  async function searchMovies(query) {
    const data = await api(`/search/movie?query=${encodeURIComponent(query)}&page=1`);
    return data.results;

  // ── Render ───────────────────────────────────────────────────────────────
  const ESC_MAP = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };

  // TMDB text goes into innerHTML and attributes, so escape it first
  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ESC_MAP[c]);
  }

  function posterImg(path, title) {
    if (path) return `<img src="${IMG}${path}" alt="${esc(title)}" loading="lazy" />`;
    return `<div class="no-poster">No Image</div>`;
  }

  // ── Adult / Pin ──────────────────────────────────────────────────────────
  const ADULT_PIN = "%%ADULT_PIN%%";
  let pinEntry = "";

  function promptPin() {
    if (!ADULT_PIN) return;
    if (state.adultUnlocked) { switchTab("adult"); return; }
    pinEntry = "";
    updatePinDots();
    document.getElementById("pinError").textContent = "";
    document.getElementById("pinOverlay").style.display = "flex";

  function pinKey(val) {
    if (val === "del") {
      pinEntry = pinEntry.slice(0, -1);
    } else if (pinEntry.length < 4) {
      pinEntry += val;
    }
    updatePinDots();
    document.getElementById("pinError").textContent = "";
    if (pinEntry.length === 4) checkPin();

  function updatePinDots() {
    document.querySelectorAll(".pin-dot").forEach((dot, i) => {
      dot.classList.toggle("filled", i < pinEntry.length);

  function checkPin() {
    if (pinEntry === ADULT_PIN) {
      state.adultUnlocked = true;
      document.getElementById("pinOverlay").style.display = "none";

      if (!document.querySelector("nav button[data-tab='adult']")) {

        btn.textContent = "Adult";
        btn.addEventListener("click", () => switchTab("adult"));
        document.querySelector("nav").appendChild(btn);
      }
      switchTab("adult");
      loadAdult();

      document.getElementById("pinError").textContent = "Incorrect PIN";

  async function loadAdult() {
    const grid = document.getElementById("adultGrid");
    grid.innerHTML = `<div class="loading">Loading...</div>`;
    try {
      const movies = [];
      for (let page = 1; page <= 10 && movies.length < 20; page++) {

  async function randomMovie(btn) {

      // Get total pages first, then pick a random one
      const first = await api(`${base}&page=1`);

      const page = Math.floor(Math.random() * maxPage) + 1;
      const data = page === 1 ? first : await api(`${base}&page=${page}`);
      const movie = data.results[Math.floor(Math.random() * data.results.length)];
      state.movieData[movie.id] = movie;

  // ── Sort ─────────────────────────────────────────────────────────────────
  function getSortedMovies(movies) {
    const sorted = state.genreFilter
      ? movies.filter(m => (m.genre_ids || []).includes(Number(state.genreFilter)))
      : [...movies];
    switch (state.sort) {
      case "added-asc":  return sorted;
      case "added-desc": return sorted.reverse();
      case "title-asc":  return sorted.sort((a, b) => a.title.localeCompare(b.title));
      case "title-desc": return sorted.sort((a, b) => b.title.localeCompare(a.title));
      case "year-desc":  return sorted.sort((a, b) => (b.release_date || "").localeCompare(a.release_date || ""));
      case "year-asc":   return sorted.sort((a, b) => (a.release_date || "").localeCompare(b.release_date || ""));
      default: return sorted;
    }
  }

  function watchlistEmptyMessage() {
    if (!state.movies.length) return "Your watchlist is empty. Search for movies to add.";
    if (state.genreFilter) return "No titles match the selected genre.";
    if (state.filter === "free") return "None of your watchlist titles are available for free.";
    if (state.filter === "streamable") return "None of your watchlist titles are currently streaming.";
    return "Your watchlist is empty.";
  }

  // Single render path for My List: applies the active filter, genre and sort
  function renderWatchlist() {
    const grid = document.getElementById("watchlistGrid");
    const key = state.filter === "free" ? "free" : "flatrate";
    const base = state.filter === "all" ? state.movies
      : state.movies.filter(m => state.providersCache[m.id]?.[key]?.length > 0);
    const result = getSortedMovies(base);
    document.getElementById("watchlistCount").textContent = result.length;
    if (!result.length) { showEmpty(grid, watchlistEmptyMessage()); return; }
    renderMovies(grid, result, "watchlist");

  function populateGenreSelect() {
    const genreIds = new Set(state.movies.flatMap(m => m.genre_ids || []));
    const select = document.getElementById("genreSelect");
    const current = select.value;
    select.innerHTML = `<option value="">All Genres</option>`;
    [...genreIds]
      .filter(id => state.genres[id])
      .sort((a, b) => state.genres[a].localeCompare(state.genres[b]))
      .forEach(id => {
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = state.genres[id];
        if (String(id) === current) opt.selected = true;
        select.appendChild(opt);
      });
    state.genreFilter = select.value;
  }

  function setView(scope, view) {

    document.getElementById(`${prefix}-grid-btn`).classList.toggle("active", view === "grid");

  // ── Actions ──────────────────────────────────────────────────────────────
  async function loadWatchlist() {
    const grid = document.getElementById("watchlistGrid");
    grid.innerHTML = `<div class="loading">Loading...</div>`;
    state.providersCache = {};
    state.genreFilter = "";
    document.getElementById("genreSelect").value = "";
    setFilter("all", false);
    try {
      const movies = await fetchWatchlist();
      state.movies = movies;
      movies.forEach(m => state.movieData[m.id] = m);
      state.watchlistIds = new Set(movies.map(m => m.id));
      populateGenreSelect();
      renderWatchlist();
    } catch (e) {
      showEmpty(grid, `Error: ${e.message}`);
    }
  }

  async function setFilter(filter, render = true) {
    state.filter = filter;
    document.querySelectorAll(".pill").forEach(p => p.classList.toggle("active", p.dataset.filter === filter));
    if (!render) return;

    const grid = document.getElementById("watchlistGrid");

    if (filter === "all") {
      renderWatchlist();
      return;
    }

    // Streamable: fetch any uncached providers then filter
    grid.innerHTML = `<div class="loading">Checking streaming availability...</div>`;
    const uncached = state.movies.filter(m => !(m.id in state.providersCache));
    await Promise.all(uncached.map(async m => {
      try {
        const data = await api(`/movie/${m.id}/watch/providers`);
        const us = data.results?.US || {};
        state.providersCache[m.id] = {
          flatrate: us.flatrate || [],
          free: [...(us.free || []), ...(us.ads || [])],
        };
      } catch {
        state.providersCache[m.id] = { flatrate: [], free: [] };
      }
    }));

    // Ignore a stale response if the user picked another filter while providers loaded
    if (state.filter !== filter) return;
    renderWatchlist();
  }

  // Keep state.movies in sync so My List reflects adds/removes without a refresh
  function syncWatchlistState(movieId, inList) {
    if (inList) {
      state.watchlistIds.add(movieId);
      const movie = state.movieData[movieId];
      if (movie && !state.movies.some(m => m.id === movieId)) state.movies.push(movie);
    } else {
      state.watchlistIds.delete(movieId);
      state.movies = state.movies.filter(m => m.id !== movieId);
    }
    populateGenreSelect();
    renderWatchlist();
  }

  async function removeMovie(movieId, btn) {
    btn.disabled = true;
    btn.textContent = "...";
    try {
      await setWatchlist(movieId, false);
      syncWatchlistState(movieId, false);
      toast("Removed from watchlist");

      btn.disabled = false;
      btn.textContent = "Remove";
      toast(`Error: ${e.message}`);

  async function addMovie(movieId, btn) {
    btn.disabled = true;
    btn.textContent = "...";
    try {
      await setWatchlist(movieId, true);
      syncWatchlistState(movieId, true);
      btn.textContent = "In List";
      btn.classList.add("added");
      btn.onclick = null;
      toast("Added to watchlist");
    } catch (e) {
      btn.disabled = false;
      btn.textContent = "+ Add";
      toast(`Error: ${e.message}`);
    }

  let trendingSeq = 0; // bumped on every fresh load so stale responses are dropped

  async function loadTrending(append = false) {
    const grid = document.getElementById("trendingGrid");
    const loadMoreWrapper = document.getElementById("loadMoreWrapper");
    const loadMoreBtn = document.getElementById("loadMoreBtn");

    const seq = append ? trendingSeq : ++trendingSeq;
    if (!append) {
      state.trendingMovies = [];
      state.trendingPage = 0;
      grid.innerHTML = `<div class="loading">Loading...</div>`;
      loadMoreWrapper.style.display = "none";
    } else {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = "Loading...";
    }

    const page = state.trendingPage + 1;
    try {
      const path = state.trendingGenreId
        ? `/discover/movie?sort_by=popularity.desc&with_genres=${state.trendingGenreId}&page=${page}`
        : `/trending/movie/week?page=${page}`;
      const data = await api(path);
      if (seq !== trendingSeq) return;
      const movies = data.results;
      state.trendingPage = page;
      state.trendingTotalPages = data.total_pages;
      movies.forEach(m => state.movieData[m.id] = m);
      state.trendingMovies.push(...movies);

      if (!append) {
        grid.innerHTML = "";
      }
      const isGrid = state.view.search === "grid";
      grid.className = isGrid ? "grid" : "list";
      grid.insertAdjacentHTML("beforeend", movies.map(m => isGrid ? renderSearchCard(m) : renderSearchRow(m)).join(""));

      loadMoreWrapper.style.display = page < data.total_pages ? "block" : "none";
      loadMoreBtn.disabled = false;
      loadMoreBtn.textContent = "Load 20 More";
    } catch (e) {
      if (seq !== trendingSeq) return;
      if (!append) grid.innerHTML = "";
      loadMoreWrapper.style.display = "none";
    }
  }

  async function loadMoreTrending() {
    await loadTrending(true);
  }

  async function doSearch(query) {
    if (!query.trim()) return;
    const grid = document.getElementById("searchGrid");
    grid.innerHTML = `<div class="loading">Searching...</div>`;
    document.getElementById("trendingSection").style.display = "none";
    switchTab("search");
    try {
      const movies = await searchMovies(query);
      if (!movies.length) { showEmpty(grid, `No results for "${query}"`); return; }
      movies.forEach(m => state.movieData[m.id] = m);
      grid.dataset.movies = JSON.stringify(movies);
      renderMovies(grid, movies, "search");
      document.getElementById("searchControls").style.display = "block";
    } catch (e) {
      showEmpty(grid, `Error: ${e.message}`);
    }
  }

  function clearSearch() {
    document.getElementById("searchGrid").innerHTML = "";
    document.getElementById("searchInput").value = "";
    document.getElementById("searchControls").style.display = "none";
    document.getElementById("trendingSection").style.display = "block";
    document.getElementById("trendingLabel").textContent = "Trending This Week";
    document.querySelectorAll("#genreQuickSearch .pill").forEach(p => p.classList.remove("active"));
    const hadGenre = state.trendingGenreId !== null;
    state.trendingGenreId = null;
    if (hadGenre || !state.trendingMovies.length) loadTrending();
    document.getElementById("searchInput").focus();
  }

  async function browseGenre(genreId, genreName) {
    // Toggle off if already active
    const pills = document.querySelectorAll("#genreQuickSearch .pill");
    const activeBtn = [...pills].find(p => p.classList.contains("active"));
    const clickedBtn = [...pills].find(p => p.textContent === genreName);
    if (activeBtn === clickedBtn) {
      clickedBtn.classList.remove("active");
      document.getElementById("trendingLabel").textContent = "Trending This Week";
      state.trendingGenreId = null;
      await loadTrending(false);
      return;
    }
    pills.forEach(p => p.classList.remove("active"));
    clickedBtn.classList.add("active");

    document.getElementById("trendingLabel").textContent = `Trending in ${genreName}`;
    document.getElementById("searchGrid").innerHTML = "";
    document.getElementById("searchControls").style.display = "none";
    document.getElementById("trendingSection").style.display = "block";
    document.getElementById("searchInput").value = "";
    state.trendingGenreId = genreId;
    await loadTrending(false);
  }

  function renderModalProviders(el, title, flatrate, free) {
    if (!flatrate.length && !free.length) {
      el.innerHTML = `<p style="color:var(--muted);font-size:13px">Not currently streaming in the US.</p>`;
      return;
    }

    function sortProviders(providers) {
      return [...providers].sort((a, b) => {
        const aOwn = isMyService(a.provider_name);
        const bOwn = isMyService(b.provider_name);
        return (bOwn - aOwn) || a.provider_name.localeCompare(b.provider_name);
      });
    }

    function providerCard(p) {
      const mine = isMyService(p.provider_name);
      return `
        <div class="provider" style="${mine ? "opacity:1" : "opacity:0.45"}">
          <div style="position:relative;display:inline-block">
            <img src="https://image.tmdb.org/t/p/w92${p.logo_path}" alt="${esc(p.provider_name)}" />
            ${mine ? `<span style="position:absolute;bottom:-3px;right:-3px;background:#4caf50;border-radius:50%;width:14px;height:14px;font-size:9px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700">✓</span>` : ""}
          </div>
          <span>${esc(p.provider_name)}</span>
        </div>`;
    }

    function group(label, providers) {
      const visible = providers.filter(p => !EXCLUDED_PROVIDERS.has(p.provider_name.toLowerCase()));
      if (!visible.length) return "";
      const sorted = sortProviders(visible);
      return `
        <div style="width:100%;margin-bottom:12px">
          <div style="font-size:11px;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted);margin-bottom:8px">${label}</div>
          <div style="display:flex;flex-wrap:wrap;gap:12px">
            ${sorted.map(providerCard).join("")}
          </div>
        </div>`;
    }

    el.innerHTML = group("Subscription", flatrate) + group("Free", free);
  }

  async function openModal(movieId) {
    const movie = state.movieData[movieId] || {};
    const title = movie.title || "";
    const year = (movie.release_date || "").slice(0, 4);
    const posterPath = movie.poster_path || "";
    const overview = movie.overview || "";

    const overlay = document.getElementById("modalOverlay");
    const providersEl = document.getElementById("modalProviders");

    const rating = movie.vote_average ? `★ ${movie.vote_average.toFixed(1)}` : "";
    const genres = (movie.genre_ids || []).map(id => state.genres[id]).filter(Boolean);

    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalYear").textContent = year;
    document.getElementById("modalRating").textContent = rating;
    document.getElementById("modalCert").textContent = "";
    document.getElementById("modalGenres").innerHTML = genres.map(g =>
      `<span style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px;padding:2px 7px;color:var(--muted)">${esc(g)}</span>`
    ).join("");
    document.getElementById("modalPoster").innerHTML = posterPath
      ? `<img src="${IMG}${posterPath}" alt="${esc(title)}" />`
      : "";
    document.getElementById("modalOverview").textContent = overview;
    const query = encodeURIComponent(title + " " + year + " film");
    const isAdult = movie.adult === true;
    document.getElementById("modalGoogleLink").href = isAdult
      ? `https://www.startpage.com/search?q=${query}`
      : `https://www.google.com/search?q=${query}`;
    document.getElementById("modalGoogleLink").textContent = isAdult ? "Search Startpage →" : "Search Google →";
    updateModalWatchlistBtn(movieId);

    providersEl.innerHTML = `<span style="color:var(--muted);font-size:13px">Loading...</span>`;
    overlay.style.display = "flex";

    // Use cached providers if available
    // Entries written by the Stream/Free filter have no cast or certification, so refetch those
    if (state.providersCache[movieId]?.cast) {
      const { flatrate, free, certification, cast } = state.providersCache[movieId];
      document.getElementById("modalCert").textContent = certification || "";
      renderModalCast(cast || []);
      renderModalProviders(providersEl, title, flatrate, free);
      return;
    }
    document.getElementById("modalCast").innerHTML = "";

    try {
      const [providerData, releaseData, creditsData] = await Promise.all([
        api(`/movie/${movieId}/watch/providers`),
        api(`/movie/${movieId}/release_dates`),
        api(`/movie/${movieId}/credits`),
      ]);
      const us = providerData.results?.US || {};
      const flatrate = us.flatrate || [];
      const free = [...(us.free || []), ...(us.ads || [])];
      const usRelease = releaseData.results?.find(r => r.iso_3166_1 === "US");
      const certification = usRelease?.release_dates?.find(r => r.certification)?.certification || "";
      const cast = (creditsData.cast || []).slice(0, 5);
      state.providersCache[movieId] = { flatrate, free, certification, cast };
      document.getElementById("modalCert").textContent = certification;
      renderModalCast(cast);
      renderModalProviders(providersEl, title, flatrate, free);
    } catch (e) {
      providersEl.innerHTML = `<span style="color:var(--muted);font-size:13px">Error loading providers.</span>`;
    }
  }

  function closeModal(e) {
    if (e && e.target !== document.getElementById("modalOverlay")) return;
    document.getElementById("modalOverlay").style.display = "none";
  }

  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    document.getElementById("modalOverlay").style.display = "none";
    document.getElementById("pinOverlay").style.display = "none";
  });

  // ── Tabs ─────────────────────────────────────────────────────────────────
  function switchTab(name) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll("nav button").forEach(b => b.classList.remove("active"));
    document.getElementById(`tab-${name}`).classList.add("active");
    document.querySelector(`nav button[data-tab="${name}"]`)?.classList.add("active");
    // Only fetch on first visit; reloading here would reset "Load More" progress
    if (name === "search" && !state.trendingMovies.length) loadTrending();
  }

  // ── Toast ────────────────────────────────────────────────────────────────
  let toastTimer;
  function toast(msg) {
    const el = document.getElementById("toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 2500);
  }

  // ── Init ─────────────────────────────────────────────────────────────────
  document.querySelectorAll("nav button").forEach(btn => {
    btn.addEventListener("click", () => switchTab(btn.dataset.tab));
  });

  document.getElementById("searchBtn").addEventListener("click", () => {
    doSearch(document.getElementById("searchInput").value);
  });

  document.getElementById("searchInput").addEventListener("keydown", e => {
    if (e.key === "Enter") doSearch(e.target.value);
  });

  document.getElementById("refreshBtn").addEventListener("click", loadWatchlist);

  // Load genre list first, then watchlist so genres are ready for the dropdown
  api("/genre/movie/list").then(data => {
    data.genres.forEach(g => state.genres[g.id] = g.name);
  }).catch(() => {}).finally(() => loadWatchlist());

  if (!ADULT_PIN) document.getElementById("adultBtn").style.display = "none";
</script>
</body>
</html>
